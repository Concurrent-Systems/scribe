# Publishing is what a GitHub release means. Nothing publishes from a branch,
# and nothing publishes by hand from a laptop.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # npm reads this to prove which workflow is publishing -- it is both the
  # trusted-publisher credential and what signs the provenance statement.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # npm does the publishing. Bun builds and tests, but provenance and
      # trusted publishing need the npm client.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # The gate is the same one CI runs. A release is not a reason to skip it.
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      - run: bun run build

      # The tag is the version, or the release is wrong. Publishing a mismatch
      # burns a version number that can never be reused.
      - name: The tag and package.json must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::release tag v${tag} does not match package.json ${pkg}"
            exit 1
          fi
          echo "Publishing ${pkg}"

      # No token. npm trusts this workflow through OIDC, so there is no
      # long-lived credential to leak. `--access public` is stated rather than
      # left to `publishConfig`: a scoped package is private by default, and
      # the first publish of 1.0.0 landed needing the visibility confirmed by
      # hand.
      - run: npm publish --access public
